[workspace]
resolver = "2"
members = [
    "crates/atom-arc-core",
    "crates/atom-arc-dxcore",
    "crates/atom-arc-lab",
    "crates/atom-arc-model",
    "crates/atom-arc-security",
    "crates/atom-arc-platform",
    "crates/atom-arc-runtime",
    "crates/atom-arcctl",
]
default-members = ["crates/atom-arcctl"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
authors = ["Atom Arc contributors"]
repository = "https://example.invalid/atom-arc-driver"

[workspace.dependencies]
clap = { version = "4.5.41", features = ["derive"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.141"
thiserror = "2.0.12"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
